<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría de Ambientes · Chio Lecca · 2026-II</title>
<meta name="description" content="Ocupación de aulas, carga docente y reprogramación de dictados. Dirección Académica, Instituto Chio Lecca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#0088b0;
  --color-accent-2:#d6006c;
  --color-divider:color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100:#f8f4f4; --color-neutral-200:#eae7e7; --color-neutral-300:#d7d3d3;
  --color-neutral-400:#bab6b6; --color-neutral-500:#9b9797; --color-neutral-600:#7d7979;
  --color-neutral-700:#605d5d; --color-neutral-800:#444141; --color-neutral-900:#2d2b2b;

  --color-accent-100:#e9f8ff; --color-accent-200:#cbeeff; --color-accent-300:#99e0ff;
  --color-accent-400:#62c5ee; --color-accent-500:#38a6cf; --color-accent-600:#1186ac;
  --color-accent-700:#006786; --color-accent-800:#004961; --color-accent-900:#0a303e;

  --color-accent-2-100:#fff1f4; --color-accent-2-200:#ffdee6; --color-accent-2-300:#ffc0d0;
  --color-accent-2-400:#ff90b1; --color-accent-2-500:#ff458e; --color-accent-2-600:#d82071;
  --color-accent-2-700:#aa0b56; --color-accent-2-800:#790e3d; --color-accent-2-900:#4b1528;

  --font-heading:"Source Serif 4", Georgia, serif;
  --font-heading-weight:600;
  --font-body:"Source Serif 4", Georgia, serif;

  --space-1:5px; --space-2:10px; --space-3:15px; --space-4:20px; --space-6:30px; --space-8:40px;
  --radius-sm:1px; --radius-md:2px; --radius-lg:4px;
  --shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:var(--font-heading-weight);line-height:1.1}
a{color:var(--color-accent-700)}

/* --- componentes del sistema --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:14px;line-height:1.2;
  color:var(--color-text);background:transparent;border:1px solid transparent;
  padding:var(--space-2) calc(var(--space-3)*1.2);border-radius:var(--radius-md)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);color:var(--color-bg)}
.btn-primary:hover{background:var(--color-accent-600)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-danger{border:1px solid var(--color-accent-2-600);color:var(--color-accent-2-700)}
.btn-danger:hover{background:var(--color-accent-2-100)}
.btn-ghost{color:var(--color-accent);padding-inline:var(--space-1)}
.btn-block{width:100%;margin-top:var(--space-2)}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb,var(--color-text) 70%,transparent)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--color-text);
  caret-color:var(--color-accent);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
select.input{min-height:36px}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider);border-radius:var(--radius-md);flex-wrap:wrap}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.seg-opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt:has(input:checked){background:var(--color-accent);color:var(--color-bg)}
.seg-opt:not(:has(input:checked)):hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:1.5px;white-space:nowrap}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in srgb,var(--color-text) 60%,transparent);padding:var(--space-2);border-bottom:1px solid var(--color-divider)}
.table td{padding:var(--space-2);border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);vertical-align:top}
.table tbody tr:hover{background:color-mix(in srgb,var(--color-text) 4%,transparent)}
.table td.num{text-align:right;font-variant-numeric:tabular-nums}

/* --- estructura editorial --- */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.regla-gruesa{height:5px;background:var(--color-text)}
.regla-fina{height:1px;background:var(--color-text)}
.envoltura{padding:0 28px}
.cabecera{position:sticky;top:0;z-index:20;background:var(--color-bg)}
.cab-fila{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;padding:12px 28px 6px}
.cab-fila img.iso{height:30px;width:auto;display:block}
.cab-marca{font-family:var(--font-heading);font-weight:600;font-size:19px;letter-spacing:-.01em;margin-right:auto}
.cab-marca span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-left:12px}
.cab-estado{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px}
.punto{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--color-neutral-400)}
.punto.on{background:var(--color-accent)}
.punto.off{background:var(--color-accent-2-500)}
nav.tabs{display:flex;gap:22px;padding:0 28px 10px;flex-wrap:wrap;align-items:baseline}
nav.tabs button{background:none;border:0;cursor:pointer;font-family:var(--font-heading);font-weight:600;
  font-size:15px;color:var(--color-text);opacity:.55;padding:2px 0}
nav.tabs button[aria-current="true"]{opacity:1;box-shadow:inset 0 -3px 0 var(--color-accent)}
nav.tabs button:hover{opacity:1}
nav.tabs .badge{font-size:10px;letter-spacing:.06em;background:var(--color-accent-2-600);color:var(--color-bg);
  padding:1px 6px;margin-left:6px;border-radius:1.5px;vertical-align:2px}
main{padding:32px 28px 90px}
h2.titulo{font-size:27px;margin:0}
p.entrada{font-size:14px;opacity:.72;max-width:66ch;margin:8px 0 24px}
.kpis{display:flex;gap:54px;flex-wrap:wrap;align-items:flex-start;margin-bottom:42px}
.kpi .n{font-size:44px;line-height:1;font-family:var(--font-heading);font-weight:600}
.kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:4px}
.kpi .d{font-size:12px;opacity:.55;max-width:24ch;margin-top:4px}
.barra-filtros{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.oculto{display:none!important}

/* --- mapa de calor --- */
.heat-scroll{overflow-x:auto;padding-bottom:10px}
.heat{min-width:940px}
.heat-fila{display:grid;grid-template-columns:64px repeat(18,1fr);gap:2px;margin-top:2px}
.heat-cab{display:grid;grid-template-columns:64px repeat(18,1fr);gap:2px;margin-bottom:3px}
.heat-aula{font-size:13px;padding-right:8px;text-align:right;line-height:26px}
.heat-dia{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;text-align:center;grid-column:span 3}
.heat-turno{font-size:10px;text-align:center;opacity:.5}
.heat-celda{height:26px;border:0;cursor:pointer;font-size:10px;color:var(--color-bg);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-body);border-radius:1px}
.leyenda{display:flex;gap:16px;align-items:center;margin-top:20px;font-size:12px;opacity:.85;flex-wrap:wrap}
.leyenda i{width:26px;height:12px;display:inline-block}

/* --- grilla del día --- */
.grid-scroll{overflow-x:auto;border-top:1px solid var(--color-divider);padding-top:6px}
.grid-cuerpo{min-width:1100px}
.grid-horas,.grid-fila{display:grid;gap:2px;align-items:stretch}
.grid-horas{margin-bottom:4px}
.grid-hora{font-size:10px;letter-spacing:.06em;opacity:.55;text-align:left;border-left:1px solid var(--color-divider);padding-left:3px}
.grid-aula{font-size:13px;padding:6px 8px 6px 0;text-align:right;line-height:1.2;border-right:1px solid var(--color-divider)}
.grid-aula small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.5}
.grid-pista{position:relative;min-height:46px;background:
  repeating-linear-gradient(90deg,transparent,transparent calc(100%/60 - 1px),color-mix(in srgb,var(--color-text) 7%,transparent) calc(100%/60 - 1px),color-mix(in srgb,var(--color-text) 7%,transparent) calc(100%/60))}
.bloque{position:absolute;top:3px;bottom:3px;background:var(--color-accent-200);border-left:3px solid var(--color-accent);
  padding:3px 5px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;font-size:12px;line-height:1.2;border-radius:1px;
  border-top:0;border-right:0;border-bottom:0}
.bloque:hover{background:var(--color-accent-300)}
.bloque.cruce{background:var(--color-accent-2-200);border-left-color:var(--color-accent-2-600)}
.bloque.propuesto{background:var(--color-accent-100);border-left-style:dashed}
.bloque b{font-family:var(--font-heading);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloque span{display:block;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* --- panel lateral --- */
.velo{position:fixed;inset:0;background:color-mix(in srgb,#201e1d 38%,transparent);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
.velo.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--color-bg);
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .22s ease;z-index:51;overflow-y:auto;padding:0 0 60px}
.panel.on{transform:translateX(0)}
.panel-cab{background:var(--color-text);color:var(--color-bg);padding:18px 24px}
.panel-cuerpo{padding:22px 24px}
.panel dl{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:14px;margin-bottom:20px}
.panel dt{opacity:.6}
.aviso{border-left:3px solid var(--color-accent-2-600);background:var(--color-accent-2-100);padding:10px 12px;font-size:13.5px;margin:14px 0}
.aviso.ok{border-left-color:var(--color-accent);background:var(--color-accent-100)}
.rejilla-campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}

footer{border-top:1px solid var(--color-divider);padding:20px 28px 50px;font-size:12px;opacity:.6}
footer p{max-width:80ch;margin:3px 0}
@media (max-width:700px){
  .kpis{gap:26px}.kpi .n{font-size:32px}main{padding:22px 16px 70px}
  .cab-fila,nav.tabs{padding-inline:16px}.envoltura{padding-inline:16px}
}
@media print{.cabecera,nav.tabs,.velo,.panel,.barra-filtros{display:none}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var URL_SALA = "";

/* Quiénes pueden proponer y quién aprueba. El rol real lo valida el

];

var DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var TURNOS = ['Mañana','Tarde','Noche'];

var S = {
  tab:'panorama', dia:'Lunes', turno:'Todos', q:'',
  cambios:[],            // propuestas e historial
  sesion:null,           // {correo,nombre,rol,clave}
  url: URL_SALA || localStorage.getItem(LS+'url') || '',

};

/* ---------- utilidades ---------- */
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function min(h){ if(!h) return 0; var p=String(h).split(':'); return (+p[0])*60+(+p[1]||0); }
function hhmm(m){ var h=Math.floor(m/60), q=m%60; return (h<10?'0':'')+h+':'+(q<10?'0':'')+q; }
function turnoDe(m){ return m<13*60 ? 'Mañana' : (m<18*60 ? 'Tarde' : 'Noche'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function el(id){ return document.getElementById(id); }

/* ---------- programación vigente = base + cambios aprobados ---------- */
function vigente(){
  var mapa = {};
  S.cambios.forEach(function(c){
    if(c.estado==='aprobado') mapa[c.did] = c;
  });
  return D.prog.map(function(p){
    var c = mapa[p.id];
    if(!c) return p;
    var q = {}; for(var k in p) q[k]=p[k];
    if(c.aula) q.aula = c.aula;
    if(c.dia)  q.dia  = c.dia;
    if(c.ini)  { q.ini = c.ini; q.fin = c.fin; q.horario = c.ini+'-'+c.fin; q.turno = turnoDe(min(c.ini)); }
    if(c.accion==='desactivar') q.activo = 'NO';
    if(c.accion==='activar')    q.activo = 'SÍ';
    q.movido = true;
    return q;
  });
}
function activos(){ return vigente().filter(function(p){return p.activo==='SÍ';}); }
function pendientes(){ return S.cambios.filter(function(c){return c.estado==='pendiente';}); }

/* ---------- cruces calculados en vivo ---------- */
function cruces(lista){
  var res = [];
  var porLlave = {};
  lista.forEach(function(p){
    if(!p.aula || p.aula==='VIRTUAL' || p.aula==='POR DEFINIR') return;
    var k = p.dia+'|'+p.aula;
    (porLlave[k] = porLlave[k] || []).push(p);
  });
  Object.keys(porLlave).forEach(function(k){
    var arr = porLlave[k].slice().sort(function(a,b){return min(a.ini)-min(b.ini);});
    for(var i=0;i<arr.length-1;i++){
      for(var j=i+1;j<arr.length;j++){
        if(min(arr[j].ini) < min(arr[i].fin) && min(arr[i].ini) < min(arr[j].fin)){
          res.push([arr[i],arr[j]]);
        }
      }
    }
  });
  return res;
}
function idsEnCruce(lista){
  var s = {};
  cruces(lista).forEach(function(par){ s[par[0].id]=1; s[par[1].id]=1; });
  return s;
}
function sobreAforo(p){
  var n = parseInt(p.alumnos,10), a = parseInt(p.aforo,10);
  return (!isNaN(n) && !isNaN(a) && n>a);
}

/* ---------- sala compartida (Google Sheets vía Apps Script) ---------- */
function pintarSync(){
  var punto = el('puntoSync'), txt = el('textoSync');
  punto.className = 'punto ' + (S.sync==='on'?'on':(S.sync==='error'?'off':''));
  txt.textContent = S.sync==='on' ? 'Sala conectada' : (S.sync==='error' ? 'Sin conexión' : 'Sin sala compartida');
}
function traer(cb){
  if(!S.url){ S.sync='off'; pintarSync(); if(cb) cb(); return; }
  fetch(S.url + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.ok){ S.cambios = j.cambios || []; S.sync='on'; S.syncMsg='Última sincronización '+new Date().toLocaleTimeString('es-PE'); }
      else { S.sync='error'; S.syncMsg = (j && j.error) || 'Respuesta inesperada'; }
      pintarSync(); if(cb) cb(); render();
    })
    .catch(function(e){ S.sync='error'; S.syncMsg='No se pudo conectar: '+e.message; pintarSync(); if(cb) cb(); render(); });
}
function enviar(payload, cb){
  if(!S.url){ cb({ok:false,error:'No hay sala compartida configurada. Ve a la pestaña Datos.'}); return; }
  if(!S.sesion){ cb({ok:false,error:'Primero identifícate.'}); return; }
  payload.correo = S.sesion.correo;
  payload.clave  = S.sesion.clave;
  fetch(S.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},  /* evita el preflight que Apps Script no responde */
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(j){ if(j && j.ok){ S.cambios = j.cambios || S.cambios; } cb(j||{ok:false,error:'Respuesta vacía'}); render(); })
  .catch(function(e){ cb({ok:false,error:e.message}); });
}

/* ---------- identidad ---------- */
function abrirIdentidad(){
  var g = '<div class="panel-cab"><div class="eyebrow" style="opacity:.7">Acceso</div><h2 style="font-size:27px;margin-top:4px">Identifícate</h2></div><div class="panel-cuerpo">';
  g += '<p style="font-size:13.5px;opacity:.75;margin-bottom:18px">Tu nombre queda en el registro de cambios. La clave la valida el servidor: sin ella puedes ver todo, pero no proponer ni aprobar.</p>';
  g += '<div class="field" style="margin-bottom:14px"><label for="selCorreo">Quién eres</label><select class="input" id="selCorreo">' +
       EDITORES.map(function(u){ return '<option value="'+esc(u.correo)+'"'+(S.sesion&&S.sesion.correo===u.correo?' selected':'')+'>'+esc(u.nombre)+' — '+esc(u.correo)+'</option>'; }).join('') +
       '</select></div>';
  g += '<div class="field"><label for="inClave">Clave de edición</label><input class="input" id="inClave" type="password" placeholder="••••••••" value="'+esc(S.sesion?S.sesion.clave:'')+'"></div>';
  g += '<button class="btn btn-primary btn-block" id="btnEntrar">Guardar</button>';
  g += '<button class="btn btn-secondary btn-block" id="btnSalir">Salir y olvidar mi clave</button>';
  g += '<p style="font-size:12px;opacity:.55;margin-top:18px">Esta página es pública: cualquiera con el enlace puede consultarla. La clave no protege la lectura, protege la escritura.</p>';
  g += '</div>';
  abrirPanel(g);
  el('btnEntrar').onclick = function(){
    var c = el('selCorreo').value, u = EDITORES.filter(function(x){return x.correo===c;})[0];
    S.sesion = {correo:u.correo, nombre:u.nombre, rol:u.rol, clave: el('inClave').value};
    localStorage.setItem(LS+'sesion', JSON.stringify(S.sesion));
    cerrarPanel(); render();
  };
  el('btnSalir').onclick = function(){
    S.sesion = null; localStorage.removeItem(LS+'sesion'); cerrarPanel(); render();
  };
}

/* ---------- panel ---------- */
var panel = el('panel'), velo = el('velo'), foco = null;
function abrirPanel(html){
  foco = document.activeElement;
  panel.innerHTML = html;
  panel.classList.add('on'); velo.classList.add('on'); panel.focus();
}
function cerrarPanel(){ panel.classList.remove('on'); velo.classList.remove('on'); if(foco) foco.focus(); }
velo.onclick = cerrarPanel;
document.addEventListener('keydown', function(e){ if(e.key==='Escape') cerrarPanel(); });

/* ---------- ficha de un dictado + reprogramación ---------- */
function abrirDictado(p){
  var enCruce = idsEnCruce(activos())[p.id];
  var aulas = D.aulas.map(function(a){return a.aula;});
  if(aulas.indexOf(p.aula)<0) aulas.unshift(p.aula);
  var g = '<div class="panel-cab"><div class="eyebrow" style="opacity:.7">'+esc(p.programa)+' · '+esc(p.tipo)+'</div>' +
          '<h2 style="font-size:27px;margin-top:4px">'+esc(p.seccion||p.curso)+'</h2>' +
          '<div style="opacity:.7;font-size:14px">'+esc(p.curso)+'</div></div><div class="panel-cuerpo">';
  g += '<dl>' +
    fila('Ambiente', p.aula+' · '+p.tipoAula) +
    fila('Día y hora', p.dia+' · '+p.horario+' ('+p.turno+')') +
    fila('Docente', p.docente) +
    fila('Grupo en Q10', p.grupo) +
    fila('Alumnos', p.alumnos+' de '+p.aforo+' de aforo') +
    fila('Vigencia', (p.ini2||'')) +
    '</dl>';
  if(enCruce) g += '<div class="aviso"><b>Cruce de ambiente sin resolver.</b> Otro dictado ocupa '+esc(p.aula)+' a la misma hora el '+esc(p.dia)+'.</div>';
  if(sobreAforo(p)) g += '<div class="aviso"><b>Sobre aforo.</b> '+esc(p.alumnos)+' alumnos en un ambiente de '+esc(p.aforo)+'.</div>';
  if(p.nota) g += '<div class="aviso ok">'+esc(p.nota)+'</div>';

  g += '<div class="regla-fina" style="margin:22px 0 16px"></div>';
  g += '<div class="eyebrow" style="margin-bottom:10px">Reprogramar</div>';
  g += '<div class="rejilla-campos">';
  g += '<div class="field"><label>Ambiente</label><select class="input" id="rAula">' +
        aulas.map(function(a){return '<option'+(a===p.aula?' selected':'')+'>'+esc(a)+'</option>';}).join('') + '</select></div>';
  g += '<div class="field"><label>Día</label><select class="input" id="rDia">' +
        DIAS.map(function(d){return '<option'+(d===p.dia?' selected':'')+'>'+d+'</option>';}).join('') + '</select></div>';
  g += '<div class="field"><label>Inicio</label><input class="input" id="rIni" type="time" value="'+esc(p.ini)+'"></div>';
  g += '<div class="field"><label>Fin</label><input class="input" id="rFin" type="time" value="'+esc(p.fin)+'"></div>';
  g += '</div>';
  g += '<div class="field" style="margin-top:10px"><label>Motivo (queda en el historial)</label><input class="input" id="rMotivo" placeholder="Ej.: el taller necesita mesas de corte"></div>';
  g += '<div id="rValida" style="margin-top:12px"></div>';
  g += '<button class="btn btn-primary btn-block" id="rEnviar">Proponer el cambio</button>';
  g += '<button class="btn btn-danger btn-block" id="rBaja">Proponer dar de baja este dictado</button>';
  g += '</div>';
  abrirPanel(g);

  function validar(){
    var prop = {aula:el('rAula').value, dia:el('rDia').value, ini:el('rIni').value, fin:el('rFin').value};
    var caja = el('rValida'), msg = [];
    if(min(prop.fin) <= min(prop.ini)) msg.push('La hora de fin debe ser posterior al inicio.');
    var choques = activos().filter(function(o){
      return o.id!==p.id && o.dia===prop.dia && o.aula===prop.aula &&
             min(o.ini) < min(prop.fin) && min(prop.ini) < min(o.fin);
    });
    choques.forEach(function(o){ msg.push('Choca con '+o.seccion+' ('+o.horario+') en '+prop.aula+'.'); });
    var mismoDocente = activos().filter(function(o){
      return o.id!==p.id && o.docente===p.docente && o.dia===prop.dia &&
             min(o.ini) < min(prop.fin) && min(prop.ini) < min(o.fin);
    });
    mismoDocente.forEach(function(o){ msg.push(p.docente+' ya dicta '+o.seccion+' a esa hora.'); });
    var amb = D.aulas.filter(function(a){return a.aula===prop.aula;})[0];
    if(amb){
      var n = parseInt(p.alumnos,10), a = parseInt(amb.aforo,10);
      if(!isNaN(n) && !isNaN(a) && n>a) msg.push('El ambiente '+prop.aula+' tiene aforo '+a+' y la sección trae '+n+' alumnos.');
    }
    caja.innerHTML = msg.length
      ? '<div class="aviso">'+msg.map(esc).join('<br>')+'</div>'
      : '<div class="aviso ok">Sin conflictos. El ambiente y el docente están libres en ese horario.</div>';
    return prop;
  }
  ['rAula','rDia','rIni','rFin'].forEach(function(id){ el(id).onchange = validar; });
  validar();

  el('rEnviar').onclick = function(){
    var prop = validar();
    proponer({did:p.id, accion:'mover', aula:prop.aula, dia:prop.dia, ini:prop.ini, fin:prop.fin,
              motivo: el('rMotivo').value, resumen: resumenCambio(p, prop)});
  };
  el('rBaja').onclick = function(){
    proponer({did:p.id, accion:'desactivar', motivo: el('rMotivo').value,
              resumen: p.seccion+' — dar de baja el dictado del '+p.dia+' '+p.horario});
  };
}
function fila(t,v){ return v ? '<dt>'+esc(t)+'</dt><dd>'+esc(v)+'</dd>' : ''; }
function resumenCambio(p, n){
  var partes = [];
  if(n.aula!==p.aula) partes.push(p.aula+' → '+n.aula);
  if(n.dia!==p.dia)   partes.push(p.dia+' → '+n.dia);
  if(n.ini!==p.ini || n.fin!==p.fin) partes.push(p.horario+' → '+n.ini+'-'+n.fin);
  return p.seccion + ' — ' + (partes.length ? partes.join(' · ') : 'sin variación');
}
function proponer(c){
  c.cid = uid(); c.ts = new Date().toISOString(); c.estado='pendiente';
  c.por = S.sesion ? S.sesion.nombre : '';
  enviar({accion:'proponer', cambio:c}, function(r){
    if(r.ok){ cerrarPanel(); S.tab='cambios'; render(); }
    else alert('No se pudo registrar: ' + (r.error||'error desconocido'));
  });
}
function resolver(cid, estado){
  enviar({accion:'resolver', cid:cid, estado:estado}, function(r){
    if(!r.ok) alert('No se pudo resolver: ' + (r.error||'error desconocido'));
  });
}

  g += '<div class="heat-cab"><div></div>' + DIAS.map(function(){ return TURNOS.map(function(t){ return '<div class="heat-turno">'+t[0]+'</div>'; }).join(''); }).join('') + '</div>';

  var cru = idsEnCruce(act);
  D.aulas.forEach(function(a){
    g += '<div class="heat-fila"><div class="heat-aula">'+esc(a.aula)+'</div>';

      TURNOS.forEach(function(t){
        var bs = act.filter(function(p){ return p.aula===a.aula && p.dia===d && p.turno===t; });
        var mins = bs.reduce(function(s,p){ return s + (min(p.fin)-min(p.ini)); }, 0);

        var col = (f>0.45 || hayCruce) ? 'var(--color-bg)' : 'var(--color-text)';
        g += '<button class="heat-celda" style="background:'+bg+';color:'+col+'" data-dia="'+d+'" title="'+esc(a.aula+' · '+d+' '+t+' — '+bs.length+' dictado(s), '+Math.round(mins/60*10)/10+' h')+'">'+(bs.length?bs.length:'')+'</button>';
      });
    });
    g += '</div>';
  });
  g += '</div></div>';
  g += '<div class="leyenda"><span>Menos uso</span>' +
    [0,.25,.5,.75,1].map(function(f){ return '<i style="background:'+(f===0?'var(--color-neutral-200)':'color-mix(in srgb, var(--color-accent) '+Math.round(18+f*82)+'%, var(--color-neutral-100))')+'"></i>'; }).join('') +
    '<span>Más uso</span><span style="margin-left:14px"><i style="background:var(--color-accent-2-500);vertical-align:-1px"></i> Cruce</span></div>';
  el('vista').innerHTML = g;

  });

function kpi(n,l,d,alerta){
  return '<div class="kpi"><div class="n"'+(alerta?' style="color:var(--color-accent-2)"':'')+'>'+esc(n)+'</div><div class="l">'+esc(l)+'</div><div class="d">'+esc(d)+'</div></div>';
}

function vGrilla(){
  var act = activos().filter(function(p){ return p.dia===S.dia && coincide(p); });
  var cru = idsEnCruce(activos());
  var t0 = 7*60, t1 = 23*60;
  if(act.length){
    t0 = Math.min.apply(null, act.map(function(p){return min(p.ini);}));
    t1 = Math.max.apply(null, act.map(function(p){return min(p.fin);}));
    t0 = Math.floor(t0/60)*60; t1 = Math.ceil(t1/60)*60;
  }
  var span = t1 - t0;
  var horas = []; for(var h=t0; h<=t1; h+=60) horas.push(h);

  var g = '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">' +
    '<div><h2 class="titulo">Grilla del día</h2>' +
    '<p class="entrada" style="margin-bottom:0">Ambientes en filas, horas en columnas. Haz clic en un bloque para ver su ficha o reprogramarlo.</p></div></div>';
  g += '<div class="barra-filtros" style="margin-top:18px">' + segDias() + buscador() + '</div>';

  var cols = 'grid-template-columns:78px 1fr';
  g += '<div class="grid-scroll"><div class="grid-cuerpo">';
  g += '<div class="grid-horas" style="'+cols+'"><div></div><div style="display:grid;grid-template-columns:repeat('+(horas.length-1)+',1fr)">' +
       horas.slice(0,-1).map(function(h){ return '<div class="grid-hora">'+hhmm(h)+'</div>'; }).join('') + '</div></div>';

  var filas = D.aulas.filter(function(a){ return activos().some(function(p){return p.aula===a.aula;}); });
  activos().forEach(function(p){
    if(p.aula && !filas.some(function(a){return a.aula===p.aula;})) filas.push({aula:p.aula, tipo:'Sin ambiente físico', aforo:'—'});
  });

  filas.forEach(function(a){
    var bs = act.filter(function(p){ return p.aula===a.aula; });
    g += '<div class="grid-fila" style="'+cols+'">';
    g += '<div class="grid-aula">'+esc(a.aula)+'<small>aforo '+esc(a.aforo)+'</small></div>';
    g += '<div class="grid-pista">';
    bs.forEach(function(p){
      var izq = (min(p.ini)-t0)/span*100, an = (min(p.fin)-min(p.ini))/span*100;
      var cls = 'bloque' + (cru[p.id]?' cruce':'') + (p.movido?' propuesto':'');
      g += '<button class="'+cls+'" data-id="'+esc(p.id)+'" style="left:'+izq.toFixed(3)+'%;width:'+an.toFixed(3)+'%" title="'+esc(p.seccion+' · '+p.curso+' · '+p.docente+' · '+p.horario)+'">' +
           '<b>'+esc(p.seccion||p.curso)+'</b><span>'+esc(p.horario)+' · '+esc(p.alumnos)+' al.</span><span>'+esc(p.docente)+'</span></button>';
    });
    g += '</div></div>';
  });
  g += '</div></div>';
  el('vista').innerHTML = g;
  enlazarFiltros();
  document.querySelectorAll('.bloque').forEach(function(b){
    b.onclick = function(){ var p = activos().filter(function(x){return x.id===b.dataset.id;})[0]; if(p) abrirDictado(p); };
  });
}

  var act = activos();
  var pares = cruces(act);
  var aforos = act.filter(sobreAforo);
  var sinAmb = act.filter(function(p){ return !p.aula || p.aula==='POR DEFINIR'; });
  var bajas = vigente().filter(function(p){ return p.activo!=='SÍ'; });
  var g = '<h2 class="titulo">Alertas y conflictos</h2>' +
    '<p class="entrada">Todo esto se recalcula sobre la programación vigente, es decir, la base más los cambios ya aprobados. Si mueves un dictado, la lista cambia sola.</p>';

  g += bloqueAlerta('Cruces de ambiente', pares.length,
    pares.length ? '<table class="table"><thead><tr><th>Día</th><th>Ambiente</th><th>Se cruzan</th></tr></thead><tbody>' +
      pares.map(function(par){
        return '<tr><td>'+esc(par[0].dia)+'</td><td><strong>'+esc(par[0].aula)+'</strong></td>' +
          '<td>'+esc(par[0].seccion+' ('+par[0].horario+')')+' <span style="opacity:.5">y</span> '+esc(par[1].seccion+' ('+par[1].horario+')')+'</td></tr>';
      }).join('') + '</tbody></table>'
    : '<p style="font-size:14px;opacity:.7">Ningún ambiente está ocupado dos veces a la misma hora.</p>');

  g += bloqueAlerta('Secciones sobre aforo', aforos.length,
    aforos.length ? tablaDictados(aforos) : '<p style="font-size:14px;opacity:.7">Ninguna sección supera el aforo de su ambiente.</p>');

  g += bloqueAlerta('Sin ambiente definido', sinAmb.length,
    sinAmb.length ? tablaDictados(sinAmb) : '<p style="font-size:14px;opacity:.7">Todos los dictados tienen ambiente asignado.</p>');

  g += bloqueAlerta('Dictados dados de baja', bajas.length,
    bajas.length ? tablaDictados(bajas) : '<p style="font-size:14px;opacity:.7">Sin bajas registradas.</p>');

  el('vista').innerHTML = g;
  document.querySelectorAll('[data-did2]').forEach(function(tr){
    tr.onclick = function(){ var p = vigente().filter(function(x){return x.id===tr.dataset.did2;})[0]; if(p) abrirDictado(p); };
  });
}
function bloqueAlerta(titulo, n, cuerpo){
  return '<div style="margin-bottom:34px"><div style="display:flex;align-items:baseline;gap:10px">' +
    '<h3 style="font-size:20px">'+esc(titulo)+'</h3>' +
    '<span class="tag '+(n?'tag-accent-2':'tag-neutral')+'">'+n+'</span></div>' +
    '<div style="margin-top:10px">'+cuerpo+'</div></div>';
}
function tablaDictados(arr){
  return '<table class="table"><thead><tr><th>Día</th><th>Horario</th><th>Ambiente</th><th>Sección</th><th>Curso</th><th style="text-align:right">Alumnos</th></tr></thead><tbody>' +
    arr.map(function(p){
      return '<tr style="cursor:pointer" data-did2="'+esc(p.id)+'"><td>'+esc(p.dia)+'</td><td>'+esc(p.horario)+'</td>' +
        '<td><strong>'+esc(p.aula||'—')+'</strong></td><td>'+esc(p.seccion)+'</td><td>'+esc(p.curso)+'</td>' +
        '<td class="num">'+esc(p.alumnos)+'</td></tr>';
    }).join('') + '</tbody></table>';
}

function vCambios(){
  var pend = pendientes();
  var hist = S.cambios.filter(function(c){return c.estado!=='pendiente';})
    .sort(function(a,b){ return (b.tsResuelto||b.ts||'').localeCompare(a.tsResuelto||a.ts||''); });
  var esAdmin = S.sesion && S.sesion.rol==='admin';
  var g = '<h2 class="titulo">Cambios</h2>' +
    '<p class="entrada">Cualquier editor propone; el administrador aprueba. Un cambio aprobado se aplica de inmediato a la programación vigente de todas las pestañas. Todo queda con autor, fecha y motivo.</p>';

  g += '<h3 style="font-size:20px;margin-bottom:10px">Pendientes de aprobación <span class="tag '+(pend.length?'tag-accent-2':'tag-neutral')+'">'+pend.length+'</span></h3>';
  if(!pend.length){
    g += '<p style="font-size:14px;opacity:.7;margin-bottom:34px">No hay propuestas esperando.</p>';
  } else {
    g += '<table class="table" style="margin-bottom:34px"><thead><tr><th>Cuándo</th><th>Quién</th><th>Cambio</th><th>Motivo</th><th></th></tr></thead><tbody>';
    pend.forEach(function(c){
      g += '<tr><td style="font-size:13px">'+esc(fecha(c.ts))+'</td><td>'+esc(c.por||'—')+'</td>' +
        '<td>'+esc(c.resumen||'')+'</td><td style="font-size:13px;opacity:.75">'+esc(c.motivo||'')+'</td>' +
        '<td style="white-space:nowrap">' + (esAdmin
          ? '<button class="btn btn-primary" data-ap="'+esc(c.cid)+'">Aprobar</button> <button class="btn btn-danger" data-rz="'+esc(c.cid)+'">Rechazar</button>'
          : '<span class="tag tag-neutral">Espera al administrador</span>') + '</td></tr>';
    });
    g += '</tbody></table>';
  }

  g += '<h3 style="font-size:20px;margin-bottom:10px">Historial</h3>';
  g += hist.length
    ? '<table class="table"><thead><tr><th>Cuándo</th><th>Quién</th><th>Cambio</th><th>Motivo</th><th>Estado</th></tr></thead><tbody>' +
      hist.map(function(c){
        return '<tr><td style="font-size:13px">'+esc(fecha(c.tsResuelto||c.ts))+'</td><td>'+esc(c.por||'—')+'</td>' +
          '<td>'+esc(c.resumen||'')+'</td><td style="font-size:13px;opacity:.75">'+esc(c.motivo||'')+'</td>' +
          '<td><span class="tag '+(c.estado==='aprobado'?'tag-accent':'tag-neutral')+'">'+esc(c.estado)+'</span></td></tr>';
      }).join('') + '</tbody></table>'
    : '<p style="font-size:14px;opacity:.7">Aún no se registran cambios.</p>';

  el('vista').innerHTML = g;
  document.querySelectorAll('[data-ap]').forEach(function(b){ b.onclick=function(){ resolver(b.dataset.ap,'aprobado'); }; });
  document.querySelectorAll('[data-rz]').forEach(function(b){ b.onclick=function(){ resolver(b.dataset.rz,'rechazado'); }; });
}
function fecha(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('es-PE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}

function vDatos(){
  var g = '<h2 class="titulo">Datos y exportación</h2>' +
    '<p class="entrada">Conecta la sala compartida para que los editores trabajen sobre los mismos cambios, y exporta el corte oficial cuando lo necesites.</p>';

  g += '<h3 style="font-size:20px">Sala compartida</h3>';
  g += '<p style="font-size:14px;opacity:.75;max-width:66ch;margin:8px 0 14px">Los cambios viven en una hoja de Google. Pega aquí la dirección del servicio publicado (termina en <code>/exec</code>). Se guarda en este navegador; cada persona la pega una vez, o se deja fija en el código.</p>';
  g += '<div class="barra-filtros"><div class="field" style="flex:1;min-width:280px"><label>Dirección del servicio</label>' +
       '<input class="input" id="dUrl" value="'+esc(S.url)+'" placeholder="https://script.google.com/macros/s/…/exec"></div>' +
       '<button class="btn btn-primary" id="dGuardar" style="align-self:flex-end">Conectar</button>' +
       '<button class="btn btn-secondary" id="dSync" style="align-self:flex-end">Sincronizar ahora</button></div>';
  if(S.syncMsg) g += '<div class="aviso '+(S.sync==='on'?'ok':'')+'">'+esc(S.syncMsg)+'</div>';

  g += '<div class="regla-fina" style="margin:30px 0 20px"></div>';
  g += '<h3 style="font-size:20px">Exportar</h3>';
  g += '<div class="barra-filtros" style="margin-top:12px">' +
    '<button class="btn btn-secondary" id="eProg">Programación vigente (CSV)</button>' +
    '<button class="btn btn-secondary" id="eHist">Historial de cambios (CSV)</button>' +
    '<button class="btn btn-secondary" id="ePrint">Imprimir / PDF</button></div>';

  g += '<div class="regla-fina" style="margin:30px 0 20px"></div>';
  g += '<h3 style="font-size:20px">Actualizar la programación base</h3>';
  g += '<p style="font-size:14px;opacity:.75;max-width:66ch;margin:8px 0">La base sale del libro <strong>'+esc(D.libro)+'</strong>, hoja PROGRAMACIÓN EDITABLE, y viene incrustada en este archivo. Para cambiar el ciclo o el horario madre se regenera el archivo y se vuelve a subir al repositorio; el historial de cambios, que vive en la hoja de Google, no se toca.</p>';

  g += '<div class="regla-fina" style="margin:30px 0 20px"></div>';
  g += '<h3 style="font-size:20px">Editores</h3>';
  g += '<table class="table" style="margin-top:10px"><thead><tr><th>Correo</th><th>Rol</th><th>Puede</th></tr></thead><tbody>' +
    EDITORES.map(function(u){
      return '<tr><td>'+esc(u.correo)+'</td><td><span class="tag '+(u.rol==='admin'?'tag-accent':'tag-neutral')+'">'+esc(u.rol)+'</span></td>' +
        '<td style="font-size:13px;opacity:.8">'+(u.rol==='admin'?'Proponer y aprobar':'Proponer cambios')+'</td></tr>';
    }).join('') + '</tbody></table>';

  el('vista').innerHTML = g;
  el('dGuardar').onclick = function(){
    S.url = el('dUrl').value.trim();
    localStorage.setItem(LS+'url', S.url);
    traer();
  };
  el('dSync').onclick = function(){ traer(); };
  el('eProg').onclick = function(){
    var filas = [['Día','Turno','Inicio','Fin','Ambiente','Sección','Curso','Docente','Programa','Grupo Q10','Alumnos','Aforo','Activo']];
    vigente().forEach(function(p){ filas.push([p.dia,p.turno,p.ini,p.fin,p.aula,p.seccion,p.curso,p.docente,p.programa,p.grupo,p.alumnos,p.aforo,p.activo]); });
    csv(filas, 'programacion-vigente.csv');
  };
  el('eHist').onclick = function(){
    var filas = [['Fecha','Quién','Acción','Resumen','Motivo','Estado','Resuelto por','Fecha resolución']];
    S.cambios.forEach(function(c){ filas.push([c.ts,c.por,c.accion,c.resumen,c.motivo,c.estado,c.resueltoPor||'',c.tsResuelto||'']); });
    csv(filas, 'historial-cambios.csv');
  };
  el('ePrint').onclick = function(){ window.print(); };
}
function csv(filas, nombre){
  var txt = '\uFEFF' + filas.map(function(f){
    return f.map(function(v){ v = String(v==null?'':v); return /[",;\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(';');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download = nombre; a.click(); URL.revokeObjectURL(a.href);
}

function vGuia(){
  var pasos = [
    ['Acceso','La página es pública para consultar. Para proponer o aprobar hay que identificarse arriba a la derecha y escribir la clave de edición, que valida el servidor.'],
    ['Panorama','El mapa de calor muestra la semana completa. Cuanto más intenso el cian, más ocupado el turno. El magenta es un cruce sin resolver. Un clic te lleva a ese día.'],
    ['Grilla del día','Ambientes en filas, horas en columnas, a escala real. Los bloques con borde punteado son dictados que ya se movieron respecto de la base.'],
    ['Cambiar un dictado','Clic en el bloque, cambias ambiente, día u hora, y escribes el motivo. El motivo no es burocracia: es lo que permite entender el horario tres meses después.'],
    ['Validación en vivo','Antes de enviar, la ficha te dice si el ambiente está ocupado, si el docente ya dicta a esa hora y si el aforo alcanza. No bloquea: avisa, y tú decides.'],
    ['Propuesta y aprobación','Los editores proponen y el administrador aprueba en la pestaña Cambios. Recién al aprobar se aplica a todas las vistas.'],
    ['Buscar un hueco','En Aulas libres indicas día, hora, duración y cuántos alumnos, y sale la lista de ambientes con la primera ventana continua disponible.'],
    ['Carga docente','Sirve para ver días partidos, saltos entre sedes de aula y sobrecargas antes de que el docente reclame.'],
    ['Exportar','La programación vigente y el historial salen en CSV con punto y coma, que Excel en español abre directo.'],
    ['Actualizar el ciclo','La programación base viene del libro de Auditoría de Aulas. Cuando cambie el horario madre, se regenera este archivo y se sube al repositorio.'],
    ['Qué no es un cruce','Dos secciones en el mismo ambiente a la misma hora solo es un cruce si ambas están activas. Los dictados dados de baja no cuentan y se listan aparte.'],
    ['El registro manda','Este portal ayuda a decidir, pero el registro oficial sigue siendo el libro de Auditoría de Aulas. Lo aprobado aquí se traslada allá.']
  ];
  var g = '<h2 class="titulo">Cómo usar la plataforma</h2>' +
    '<p class="entrada">Doce pasos. Si alguien nuevo entra al equipo, esto es lo único que necesita leer.</p>';
  pasos.forEach(function(p,i){
    g += '<div style="display:grid;grid-template-columns:52px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)">' +
      '<div style="font-family:var(--font-heading);font-weight:600;font-size:26px;color:var(--color-accent)">'+(i+1)+'</div>' +
      '<div><h3 style="font-size:18px">'+esc(p[0])+'</h3><p style="font-size:14px;opacity:.78;max-width:70ch;margin-top:4px">'+esc(p[1])+'</p></div></div>';
  });
  el('vista').innerHTML = g;
}

/* ---------- filtros compartidos ---------- */
function segDias(){
  return '<div class="seg">' + DIAS.map(function(d){
    return '<label class="seg-opt"><input type="radio" name="dia"'+(S.dia===d?' checked':'')+' data-dia="'+d+'">'+d.slice(0,3)+'</label>';
  }).join('') + '</div>';
}
function buscador(ph){
  return '<input class="input" id="q" style="max-width:320px" type="search" placeholder="'+esc(ph||'Buscar sección, docente, curso o aula')+'" value="'+esc(S.q)+'">';
}
function coincide(p){
  if(!S.q) return true;
  var t = (p.seccion+' '+p.docente+' '+p.curso+' '+p.aula+' '+p.grupo+' '+p.programa).toLowerCase();
  return t.indexOf(S.q.toLowerCase())>=0;
}
function enlazarFiltros(){
  document.querySelectorAll('[data-dia]').forEach(function(r){
    r.onchange = function(){ S.dia = r.dataset.dia; render(); };
  });
  var q = el('q');
  if(q) q.oninput = function(){
    S.q = q.value;
    var pos = q.selectionStart;
    render();
    var n = el('q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  };
}

/* ---------- armado general ---------- */
var TABS = [
  ['panorama','Panorama',vPanorama],
  ['grilla','Grilla del día',vGrilla],
  ['ambientes','Ambientes',vAmbientes],
  ['libres','Aulas libres',vLibres],
  ['docentes','Docentes',vDocentes],
  ['alertas','Alertas',vAlertas],
  ['cambios','Cambios',vCambios],
  ['datos','Datos',vDatos],
  ['guia','Guía',vGuia]
];
function render(){
  el('tabs').innerHTML = TABS.map(function(t){
    var badge = '';
    if(t[0]==='cambios' && pendientes().length) badge = '<span class="badge">'+pendientes().length+'</span>';
    if(t[0]==='alertas'){
      var n = cruces(activos()).length + activos().filter(sobreAforo).length;
      if(n) badge = '<span class="badge">'+n+'</span>';
    }
    return '<button data-tab="'+t[0]+'" aria-current="'+(S.tab===t[0])+'">'+t[1]+badge+'</button>';
  }).join('');
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ S.tab = b.dataset.tab; render(); };
  });
  el('sesionCorto').textContent = S.sesion ? S.sesion.nombre : 'Invitado';
  el('btnIdentidad').textContent = S.sesion ? 'Cambiar' : 'Identificarme';
  pintarSync();
  var t = TABS.filter(function(x){return x[0]===S.tab;})[0] || TABS[0];
  t[2]();
}
el('btnIdentidad').onclick = abrirIdentidad;
el('pieFuente').textContent = 'Fuente: ' + D.libro + ', hoja PROGRAMACIÓN EDITABLE. Matrícula del export «Estudiantes» de Q10 del ' + D.fuenteQ10 + '.';

(function(){
  var img = el('iso');
  img.onload = function(){ img.style.display='block'; };
  img.onerror = function(){ img.remove(); };
  var s = localStorage.getItem(LS+'sesion');
  if(s){ try{ S.sesion = JSON.parse(s); }catch(e){} }
})();

render();
if(S.url) traer();
setInterval(function(){ if(S.url) traer(); }, 15000);
})();
</script>
